name: GoPass Cloud Diagnostic 20260909

on:
  push:
    branches:
      - tmp-cloud-diagnostic-20260909

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Show environment
        shell: pwsh
        run: |
          go version
          $PSVersionTable
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory

      - name: Compile GoPass packages
        shell: pwsh
        run: |
          go test ./internal/config ./internal/controller
          go test ./internal/api ./internal/engine ./internal/process ./cmd/gopass -run '^$'

      - name: Inspect existing cloud benchmarks
        shell: pwsh
        run: |
          Write-Host '--- cloud-benchmark.yml ---'
          if (Test-Path .github/workflows/cloud-benchmark.yml) { Get-Content .github/workflows/cloud-benchmark.yml | Select-Object -First 260 }
          Write-Host '--- benchmark tools ---'
          if (Test-Path tools) { Get-ChildItem tools -File | Sort-Object Name | Select-Object -ExpandProperty FullName }

      - name: GoPass local relay microbenchmark
        shell: pwsh
        run: |
          $src = @'
          package main
          import (
            "fmt"
            "io"
            "net"
            "sync"
            "time"
          )
          func main() {
            const total = int64(512 * 1024 * 1024)
            ln, err := net.Listen("tcp", "127.0.0.1:0")
            if err != nil { panic(err) }
            defer ln.Close()
            addr := ln.Addr().String()
            var wg sync.WaitGroup
            wg.Add(1)
            go func() {
              defer wg.Done()
              c, err := ln.Accept(); if err != nil { panic(err) }
              defer c.Close()
              buf := make([]byte, 256*1024)
              n, err := io.CopyBuffer(io.Discard, c, buf)
              if err != nil { panic(err) }
              fmt.Printf("server bytes=%d\n", n)
            }()
            c, err := net.Dial("tcp", addr); if err != nil { panic(err) }
            buf := make([]byte, 256*1024)
            for i := range buf { buf[i] = byte(i) }
            start := time.Now()
            var sent int64
            for sent < total {
              left := total - sent
              p := buf
              if int64(len(p)) > left { p = p[:left] }
              n, err := c.Write(p); if err != nil { panic(err) }
              sent += int64(n)
            }
            _ = c.Close()
            wg.Wait()
            sec := time.Since(start).Seconds()
            fmt.Printf("local_tcp_256k_mbps=%.1f seconds=%.3f bytes=%d\n", float64(total)*8/sec/1e6, sec, total)
          }
          '@
          $path = Join-Path $env:RUNNER_TEMP 'relaybench.go'
          Set-Content -Path $path -Value $src -Encoding utf8
          go run $path
