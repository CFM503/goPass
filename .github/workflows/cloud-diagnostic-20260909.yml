name: GoPass Cloud Diagnostic 20260909

on:
  push:
    branches:
      - tmp-cloud-diagnostic-20260909

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build test SOCKS5 proxy
        shell: pwsh
        run: |
          go build -o cloudbench_socks.exe ./tools/cloudbench_socks.go
          Start-Process -FilePath "$PWD\cloudbench_socks.exe" -ArgumentList "127.0.0.1:19080" -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Get-NetTCPConnection -LocalPort 19080 -ErrorAction Stop | Format-Table -AutoSize

      - name: A direct run 1
        shell: pwsh
        run: |
          curl.exe -L --retry 1 --connect-timeout 15 --max-time 90 -o NUL -w "DIRECT_1 bytes=%{size_download} time=%{time_total} speed_bps=%{speed_download}`n" https://ash-speed.hetzner.com/100MB.bin

      - name: B SOCKS5 run 1
        shell: pwsh
        run: |
          curl.exe -L --socks5-hostname 127.0.0.1:19080 --retry 1 --connect-timeout 15 --max-time 90 -o NUL -w "SOCKS5_1 bytes=%{size_download} time=%{time_total} speed_bps=%{speed_download}`n" https://ash-speed.hetzner.com/100MB.bin

      - name: A direct run 2
        shell: pwsh
        run: |
          curl.exe -L --retry 1 --connect-timeout 15 --max-time 90 -o NUL -w "DIRECT_2 bytes=%{size_download} time=%{time_total} speed_bps=%{speed_download}`n" https://ash-speed.hetzner.com/100MB.bin

      - name: B SOCKS5 run 2
        shell: pwsh
        run: |
          curl.exe -L --socks5-hostname 127.0.0.1:19080 --retry 1 --connect-timeout 15 --max-time 90 -o NUL -w "SOCKS5_2 bytes=%{size_download} time=%{time_total} speed_bps=%{speed_download}`n" https://ash-speed.hetzner.com/100MB.bin

      - name: Local TCP baseline
        shell: pwsh
        run: |
          $src = @'
package main
import ("fmt"; "io"; "net"; "sync"; "time")
func main() {
 const total=int64(256*1024*1024)
 ln,_:=net.Listen("tcp","127.0.0.1:0"); defer ln.Close()
 var wg sync.WaitGroup; wg.Add(1)
 go func(){defer wg.Done(); c,_:=ln.Accept(); defer c.Close(); n,_:=io.CopyBuffer(io.Discard,c,make([]byte,256*1024)); fmt.Println("server_bytes",n)}()
 c,_:=net.Dial("tcp",ln.Addr().String()); buf:=make([]byte,256*1024); start:=time.Now(); var sent int64
 for sent<total { p:=buf; left:=total-sent; if int64(len(p))>left {p=p[:left]}; n,_:=c.Write(p); sent+=int64(n) }
 c.Close(); wg.Wait(); sec:=time.Since(start).Seconds(); fmt.Printf("LOCAL_TCP_256K speed_mbps=%.1f seconds=%.3f bytes=%d\n",float64(total)*8/sec/1e6,sec,total)
}
'@
          $path=Join-Path $env:RUNNER_TEMP 'relaybench.go'
          Set-Content -Path $path -Value $src -Encoding utf8
          go run $path

      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-Process cloudbench_socks -ErrorAction SilentlyContinue | Select-Object Id,CPU,WorkingSet,Path
          Get-NetTCPConnection -LocalPort 19080 -ErrorAction SilentlyContinue | Format-Table -AutoSize
