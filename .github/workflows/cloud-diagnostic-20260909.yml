name: GoPass Cloud Diagnostic 20260909

on:
  push:
    branches:
      - tmp-cloud-diagnostic-20260909

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Show environment
        shell: pwsh
        run: |
          go version
          $PSVersionTable
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory

      - name: Compile GoPass packages
        shell: pwsh
        run: |
          go test ./internal/config ./internal/controller
          go test ./internal/api ./internal/engine ./internal/process ./cmd/gopass -run '^$'

      - name: Build local SOCKS5 test proxy
        shell: pwsh
        run: |
          go build -o cloudbench_socks.exe ./tools/cloudbench_socks.go
          Start-Process -FilePath "$PWD\cloudbench_socks.exe" -ArgumentList "127.0.0.1:19080" -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Get-NetTCPConnection -LocalPort 19080 -ErrorAction Stop | Format-Table -AutoSize

      - name: Direct external throughput
        shell: pwsh
        run: |
          curl.exe -L --retry 1 --connect-timeout 15 --max-time 90 -o NUL -w "direct bytes=%{size_download} time=%{time_total} speed_bps=%{speed_download}`n" https://ash-speed.hetzner.com/100MB.bin
          if ($LASTEXITCODE -ne 0) { throw 'direct download failed' }

      - name: Raw SOCKS5 external throughput
        shell: pwsh
        run: |
          curl.exe -L --socks5-hostname 127.0.0.1:19080 --retry 1 --connect-timeout 15 --max-time 90 -o NUL -w "socks5 bytes=%{size_download} time=%{time_total} speed_bps=%{speed_download}`n" https://ash-speed.hetzner.com/100MB.bin
          if ($LASTEXITCODE -ne 0) { throw 'socks5 download failed' }

      - name: GoPass UpstreamDialer throughput
        shell: pwsh
        run: |
          $src = @'
package main

import (
    "context"
    "fmt"
    "io"
    "net"
    "net/http"
    "os"
    "time"

    "github.com/CFM503/goPass/internal/engine"
)

func main() {
    url := "https://ash-speed.hetzner.com/100MB.bin"
    if len(os.Args) > 1 {
        url = os.Args[1]
    }

    d := engine.NewUpstreamDialer("socks5", "127.0.0.1:19080")
    tr := &http.Transport{
        DialContext: func(ctx context.Context, network, addr string) (net.Conn, error) {
            return d.Dial(network, addr)
        },
        DisableCompression: true,
    }
    client := &http.Client{Transport: tr}

    start := time.Now()
    resp, err := client.Get(url)
    if err != nil {
        panic(err)
    }
    defer resp.Body.Close()

    n, err := io.Copy(io.Discard, resp.Body)
    if err != nil {
        panic(err)
    }

    sec := time.Since(start).Seconds()
    fmt.Printf("upstream_dialer bytes=%d time=%.3f speed_mbps=%.1f status=%s\n", n, sec, float64(n)*8/sec/1e6, resp.Status)
}
'@
          $path = Join-Path $env:RUNNER_TEMP 'upstreambench.go'
          Set-Content -Path $path -Value $src -Encoding utf8
          go run $path

      - name: Local TCP baseline
        shell: pwsh
        run: |
          $src = @'
package main

import (
    "fmt"
    "io"
    "net"
    "sync"
    "time"
)

func main() {
    const total = int64(512 * 1024 * 1024)
    ln, err := net.Listen("tcp", "127.0.0.1:0")
    if err != nil {
        panic(err)
    }
    defer ln.Close()
    addr := ln.Addr().String()

    var wg sync.WaitGroup
    wg.Add(1)
    go func() {
        defer wg.Done()
        c, err := ln.Accept()
        if err != nil {
            panic(err)
        }
        defer c.Close()
        n, err := io.CopyBuffer(io.Discard, c, make([]byte, 256*1024))
        if err != nil {
            panic(err)
        }
        fmt.Printf("server bytes=%d\n", n)
    }()

    c, err := net.Dial("tcp", addr)
    if err != nil {
        panic(err)
    }

    buf := make([]byte, 256*1024)
    start := time.Now()
    var sent int64
    for sent < total {
        left := total - sent
        p := buf
        if int64(len(p)) > left {
            p = p[:left]
        }
        n, err := c.Write(p)
        if err != nil {
            panic(err)
        }
        sent += int64(n)
    }

    _ = c.Close()
    wg.Wait()
    sec := time.Since(start).Seconds()
    fmt.Printf("local_tcp_256k_mbps=%.1f seconds=%.3f bytes=%d\n", float64(total)*8/sec/1e6, sec, total)
}
'@
          $path = Join-Path $env:RUNNER_TEMP 'relaybench.go'
          Set-Content -Path $path -Value $src -Encoding utf8
          go run $path

      - name: Capture diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-Process cloudbench_socks -ErrorAction SilentlyContinue | Select-Object Id,CPU,WorkingSet,Path
          Get-NetTCPConnection -LocalPort 19080 -ErrorAction SilentlyContinue | Format-Table -AutoSize
