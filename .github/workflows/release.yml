name: Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          check-latest: true

      - name: Ensure MinGW GCC in PATH (for race detector / cgo)
        shell: powershell
        run: |
          if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Strawberry\c\bin\gcc.exe") {
            "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            Write-Host "gcc found: $(gcc --version | Select-Object -First 1)"
          }

      - name: Run Tests
        shell: powershell
        run: go test -v ./...

      - name: Run Race Tests
        shell: powershell
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") { $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH }
          elseif (Test-Path "C:\Strawberry\c\bin") { $env:PATH = "C:\Strawberry\c\bin;" + $env:PATH }
          $env:CGO_ENABLED = "1"
          go test -race -v ./...

      - name: Run Vet
        shell: powershell
        run: go vet ./...

  build-and-release:
    name: build-and-release
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          check-latest: true

      - name: Build Windows x64 Executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o gopass.exe ./cmd/gopass
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'v1.6.6' }
          $versioned = "gopass_" + $version.TrimStart('v') + ".exe"
          Copy-Item gopass.exe $versioned
          Get-Item gopass.exe, $versioned | Select-Object Name, Length

      - name: Upload Windows build (main validation)
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: gopass-windows-main-${{ github.sha }}
          path: gopass*.exe
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref_type == 'branch' && github.ref_name == 'main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.6.6' }}
          name: GoPass ${{ github.ref_type == 'tag' && github.ref_name || 'v1.6.6' }}
          body: |
            GoPass ${{ github.ref_type == 'tag' && github.ref_name || 'v1.6.6' }}

            - TProxy Buffer 默认值：512 KB
            - TProxy Buffer 可调范围：32 KB–2 MB
            - Web UI 提供 32 KB / 256 KB / 512 KB / 1 MB / 2 MB / 自定义预设
            - 自定义值严格限制在 32 KB–2 MB
            - Socket Buffer 固定为 0，使用 Windows TCP Auto-Tuning
            - 普通 Web UI 不再开放底层 TCP Socket Buffer / Linger 等参数
          files: |
            gopass.exe
            gopass_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag after main validation
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --exit-code --tags origin refs/tags/v1.6.6) {
            Write-Host 'v1.6.6 already exists; nothing to tag.'
            exit 0
          }
          git tag -a v1.6.6 -m 'GoPass v1.6.6' $env:GITHUB_SHA
          git push origin v1.6.6
