name: Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          check-latest: true
      - name: Ensure MinGW GCC in PATH
        shell: powershell
        run: |
          if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Strawberry\c\bin\gcc.exe") {
            "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Run Tests
        shell: powershell
        run: go test -v ./...
      - name: Run Race Tests
        shell: powershell
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") { $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH }
          elseif (Test-Path "C:\Strawberry\c\bin") { $env:PATH = "C:\Strawberry\c\bin;" + $env:PATH }
          $env:CGO_ENABLED = "1"
          go test -race -v ./...
      - name: Run Vet
        shell: powershell
        run: go vet ./...

  build:
    name: build-windows-x64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          check-latest: true
      - name: Build Windows x64 Executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o gopass.exe ./cmd/gopass
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'v1.8.2' }
          $versioned = "gopass_" + $version.TrimStart('v') + ".exe"
          Copy-Item gopass.exe $versioned
          Get-Item gopass.exe, $versioned | Select-Object Name, Length
      - name: Upload Windows build (main validation)
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: gopass-windows-main-${{ github.sha }}
          path: gopass*.exe
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoPass ${{ github.ref_name }}
          body: |
            GoPass ${{ github.ref_name }}

            - Process-whitelist transparent IPv4 TCP interception
            - Only whitelisted applications use the configured upstream SOCKS5/HTTP proxy
            - Non-whitelisted applications remain on the normal Windows direct path
            - Minimal Web UI: status, process whitelist, upstream settings, TProxy Buffer Size
            - Live process panel shows proxy/direct status, PID, connection count and target IP:port
            - TProxy Buffer Size: 32 KB–1 MB, default 64 KB
            - No GeoIP/GeoSite, DNS relay/Fake-IP, SNI, UDP/QUIC, automatic routing or route probing
          files: |
            gopass_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
